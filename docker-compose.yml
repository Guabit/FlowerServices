services:
  postgres:
    image: postgres:16-alpine
    container_name: flowerservices-db
    environment:
      POSTGRES_DB: flowerservices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: